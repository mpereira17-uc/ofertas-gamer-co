name: Reportar una oferta
description: Enlace vencido, precio incorrecto, oferta agotada u otro error en una oferta
title: "[Oferta] "
labels: ["oferta"]
body:
  - type: markdown
    attributes:
      value: "No escribas contraseñas, datos bancarios ni información personal. Este reporte es público."
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de problema
      options: [Enlace vencido, Precio incorrecto, Oferta agotada, Problema de funcionamiento, Otro]
    validations:
      required: true
  - type: input
    id: juego
    attributes:
      label: Juego y tienda
      placeholder: "Ej.: Hollow Knight en Steam"
    validations:
      required: true
  - type: textarea
    id: detalle
    attributes:
      label: ¿Qué viste?
