name: diag-wikidata (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'P'
          import urllib.parse
          from datetime import datetime, timezone, timedelta
          from ogc import sources, wikidata
          now = datetime.now(timezone.utc)
          q = wikidata.QUERY % {"min": 3, "start": (now - timedelta(days=30)).strftime("%Y-%m-%d"), "end": (now + timedelta(days=730)).strftime("%Y-%m-%d"), "limit": 12}
          d = sources.get_json(f"{wikidata.ENDPOINT}?{urllib.parse.urlencode({'query': q, 'format': 'json'})}")
          for r in d["results"]["bindings"]:
              print(r["gLabel"]["value"], "||", r.get("plats"))
          q2 = 'SELECT ?p ?l WHERE { wd:Q23648408 p:P400/ps:P400 ?p. OPTIONAL { ?p rdfs:label ?l FILTER(lang(?l) = "en") } }'
          print(sources.get_json(f"{wikidata.ENDPOINT}?{urllib.parse.urlencode({'query': q2, 'format': 'json'})}")["results"]["bindings"])
          P
          curl -sSI -H "Origin: https://ofertas-gamer-co.pages.dev" "https://video.akamai.steamstatic.com/store_trailers/2719590/638113/b903ce00335979c0f603dca735f39df10aac0d56/1750893914/hls_264_master.m3u8?t=1717149384" | grep -i "HTTP/\|access-control\|content-type"
