name: diag-wikidata (temporal)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'P'
          from datetime import datetime, timezone
          from ogc import sources, wikidata
          games = wikidata.fetch_games(datetime.now(timezone.utc), sources.get_json)
          print("juegos", len(games))
          for g in games[:40]:
              print(g["title"], g["date"], g["precision"], g["platforms"], "yt" if g.get("youtube") else "")
          P
          curl -sSI -H "Origin: https://ofertas-gamer-co.pages.dev" "https://video.akamai.steamstatic.com/store_trailers/2719590/638113/b903ce00335979c0f603dca735f39df10aac0d56/1750893914/hls_264_master.m3u8?t=1717149384" | grep -i "HTTP/\|access-control\|content-type"
